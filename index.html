<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deen — Personal Spot</title> 
    <!-- Fonts: Gaegu (Doodle hand-drawn) & Space Grotesk (Skena Tech) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background Hitam Gradasi Merah Maroon Deep */
            background: radial-gradient(circle at 50% 30%, #3a0007 0%, #120003 50%, #050001 100%);
            background-attachment: fixed;
            color: #ffe4e6;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Memaksa semua elemen termasuk watermark berurut ke bawah */
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        /* Container Utama */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Container Kartu */
        .card {
            background: rgba(18, 0, 3, 0.85);
            border: 2px solid #9f1239;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: clamp(20px, 4vw, 36px);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(159, 18, 57, 0.25), inset 0 0 15px rgba(225, 29, 72, 0.1);
            backdrop-filter: blur(12px);
            margin: 0 auto;
        }

        /* Hero Header */
        .hero {
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 20px);
            margin-bottom: clamp(16px, 3vw, 24px);
        }

        /* Stickman Avatar / Mug Hand-drawn */
        .stickman-box {
            width: clamp(65px, 15vw, 85px);
            height: clamp(65px, 15vw, 85px);
            border: 2px dashed #f43f5e;
            border-radius: 50% 45% 55% 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #270006;
            flex-shrink: 0;
            animation: softWiggle 4s infinite ease-in-out;
        }

        .hero-text h1 {
            font-family: 'Gaegu', cursive;
            font-size: clamp(2.2rem, 5vw, 2.8rem);
            color: #fb7185;
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .hero-text p {
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            color: #fecdd3;
            line-height: 1.35;
        }

        .hero-text span {
            color: #f43f5e;
            font-weight: 700;
            text-decoration: underline cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        /* Titles / Headers */
        .section-title {
            font-family: 'Gaegu', cursive;
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            color: #fda4af;
            line-height: 1;
        }

        .section-sub {
            font-size: clamp(0.75rem, 1.8vw, 0.82rem);
            color: #9f1239;
            margin-bottom: 12px;
            display: block;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        /* Line Divider */
        .doodle-line {
            height: 2px;
            background: #881337;
            margin: clamp(16px, 3vw, 24px) 0;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* Tech Stack Badges */
        .tech-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-pill {
            background: #270006;
            border: 1.5px solid #be123c;
            color: #ffe4e6;
            padding: clamp(6px, 1.5vw, 8px) clamp(12px, 2vw, 16px);
            border-radius: 20px 25px 20px 22px;
            font-size: clamp(0.8rem, 1.8vw, 0.88rem);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .tech-pill:hover {
            background: #e11d48;
            color: #fff;
            transform: scale(1.05) rotate(-2deg);
        }

        /* Social / Connect Icons Doodle Style */
        .social-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2.5vw, 16px);
            margin-top: 8px;
        }

        .social-card {
            background: #270006;
            border: 2px solid #be123c;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 12px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Styling SVG Doodle Icon */
        .doodle-icon {
            width: 100%;
            height: 100%;
            max-width: 55px;
            max-height: 55px;
            stroke: #fb7185;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.2s ease;
        }

        /* Hover Effect Skena Red-Rose */
        .social-card:hover {
            background: #e11d48;
            border-color: #f43f5e;
            transform: translateY(-5px) rotate(3deg);
            box-shadow: 0 8px 22px rgba(225, 29, 72, 0.35);
        }

        .social-card:hover .doodle-icon {
            stroke: #ffffff;
            transform: scale(1.08);
        }

        /* Animation */
        @keyframes softWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

                    <!-- Instagram Doodle -->
                    <a href="https://instagram.com/archaeopteryxsupremacy" target="_blank" class="social-card" title="Instagram">
                        <svg class="doodle-icon" viewBox="0 0 24 24">
                            <path d="M4.5 8c0-2.2 1.8-4 4-4h7c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4h-7c-2.2 0-4-1.8-4-4V8z" />
                            <path d="M8.5 12c0 1.9 1.6 3.5 3.5 3.5s3.5-1.6 3.5-3.5S13.9 8.5 12 8.5 8.5 10.1 8.5 12z" />

                    <a href="https://discord.com/users/aspiderwoman_" target="_blank" class="social-card" title="Discord">
                        <svg class="doodle-icon" viewBox="0 0 24 24">
                            <path d="M18.8 6.2C17.4 5.5 15.9 5 14.3 4.8c-.2.4-.4.8-.6 1.2-1.8-.3-3.6-.3-5.4 0-.2-.4-.4-.8-.6-1.2-1.6.2-3.1.7-4.5 1.4-2.8 4.1-3.5 8.1-3.1 12.1 1.9 1.4 3.7 2.2 5.5 2.8.4-.6.8-1.2 1.1-1.9-.6-.2-1.2-.5-1.8-.8.1-.1.3-.2.4-.3 3.5 1.6 7.3 1.6 10.7 0 .1.1.3.2.4.3-.6.3-1.2.6-1.8.8.3.7.7 1.3 1.1 1.9 1.8-.6 3.6-1.4 5.5-2.8.5-4.6-.7-8.6-3.1-12.1zM8.5 15.3c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2c0 1.2-.9 2.2-2 2.2zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2c0 1.2-.9 2.2-2 2.2z" />

    </div>

</body>
</html>
